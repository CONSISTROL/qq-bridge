<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鱼群bot 控制台</title>
<script>
  // 主题必须在样式生效前定下来，否则（深色用户）会先闪一下浅色。
  // 默认浅色；只有明确存过 dark 才切深色。
  // 这段必须内联：下面的 app.js 是 ES module（延迟执行），等不到它。
  (function () {
    try {
      if (localStorage.getItem('qq-console-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略 */ }
  })();
</script>
<!-- 资源路径必须是相对当前页面的（不能以 / 开头）：控制台可能被反代在子路径下 -->
<link rel="stylesheet" href="console/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <!-- 桥：两根塔柱 + 一道跨梁，对应「QQ ↔ DSH 桥接」 -->
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3.5 18V9.5M20.5 18V9.5M3.5 12.5c3.6-3.4 13.4-3.4 17 0M6.5 18v-2.8M17.5 18v-2.8"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="brand-copy">
          <h1>鱼群bot</h1>
          <div class="sub">DeepSeek Harness</div>
        </div>
      </div>

      <div class="side-status" id="sideStatus">
        <span class="side-status-dot"></span>
        <div class="side-status-copy"><b>连接中…</b><span>正在读取桥接状态</span></div>
      </div>

      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="hint">修改即时生效 · 桥接 5 秒内感知</div>
        <div class="sidebar-version">本地控制台 · 127.0.0.1</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <span class="page-icon" id="viewIcon" aria-hidden="true"></span>
          <div class="page-copy">
            <h2 class="view-title" id="viewTitle">加载中…</h2>
            <div class="sub view-desc" id="viewDesc"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="status-badge" id="statusText">加载中…</div>
          <button class="theme-toggle" id="themeToggle" type="button" title="切换浅色 / 深色模式" aria-label="切换浅色 / 深色模式">
            <svg class="theme-ico theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.6A8.2 8.2 0 0 1 10.4 4 7.7 7.7 0 1 0 20 13.6Z"/></svg>
            <svg class="theme-ico theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="theme-label">深色</span>
          </button>
        </div>
      </header>
      <div id="view-root"></div>
    </main>
  </div>

  <!-- 手机底栏：最常用的四个分区 + 更多 -->
  <nav class="mobile-bar" id="mobileBar" aria-label="主导航"></nav>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="mobile-sheet" id="mobileSheet" role="dialog" aria-modal="true" aria-label="全部分区" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <b>全部分区</b>
      <button class="icon-btn" type="button" data-sheet-close aria-label="关闭"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-grid" id="sheetGrid"></div>
  </div>

  <script type="module" src="console/app.js"></script>
</body>
</html>
