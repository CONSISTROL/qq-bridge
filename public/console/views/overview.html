<section class="card span-all">
  <h2>运行说明</h2>
  <div class="meta">
    <b>鱼群bot</b> 全天候在线：群消息和私聊都由 AI 自己判断要不要回，<b>文本不会自动转发</b>，
    所有发言都通过工具发出（所以它想说什么、什么时候说、说几条，都由它决定）。
  </div>
  <div class="meta" style="margin-top:6px">
    <b>睡眠时段</b>（<span id="sleepWindowText">1:00–8:00</span>）：群里只有被 @ 或被叫名字才会打扰它，
    其他消息照常记录但不唤醒，也不主动冒泡；私聊不受限制。
  </div>
  <div class="row" style="gap:8px;margin-top:10px;align-items:center">
    <button id="restartBtn" class="danger" type="button">重启</button>
    <span class="meta" id="restartMsg"></span>
  </div>
</section>



<section class="card span-all">
  <h2>服务状态 <span class="meta" id="dsStatusSummary">加载中…</span>
    <span class="card-actions">
      <button id="dsStatusRefresh" class="small" type="button">刷新</button>
      <a class="small" href="https://status.deepseek.com/" target="_blank" rel="noopener">打开状态页 ↗</a>
    </span>
  </h2>
  <div class="meta" id="dsStatusRecent" style="margin-bottom:8px"></div>
  <iframe id="dsStatusFrame" src="https://status.deepseek.com/" title="DeepSeek 服务状态"
    style="width:100%;height:520px;border:1px solid var(--line,#2a2f3a);border-radius:10px;background:#fff"></iframe>
</section>

<section class="card">
  <h2>会话映射</h2>
  <div id="sessionList">加载中…</div>
</section>

<section class="card">
  <h2>挂起审批 / 提问</h2>
  <div id="pendingList">加载中…</div>
</section>

<section class="card">
  <h2>活动日志 <span class="meta">最近 100 条</span>
    <span class="card-actions"><button id="activityJump" class="small primary" type="button" hidden>回到最新 ↓</button></span>
  </h2>
  <pre id="activity">（空）</pre>
</section>
