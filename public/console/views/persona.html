<div class="grid cols-2">
<section class="card">
  <h2>人格（角色扮演）</h2>
  <div class="meta">当前角色：<span id="roleText">-</span> ｜ 状态：<span id="roleModeText">-</span></div>
  <div id="roleList" class="mt-10">加载中…</div>
  <div class="toolbar plain mt-12">
    <input type="text" id="roleInput" class="grow" placeholder="选择已有角色或输入新角色名">
    <button id="roleSet" class="primary" type="button">设置</button>
    <button id="roleClear" type="button">清除</button>
  </div>
  <details>
    <summary>新建人格</summary>
    <div class="field mt-8">
      <label>角色名</label>
      <input type="text" id="newRoleName" placeholder="如：猫娘">
    </div>
    <div class="field mt-8">
      <label>角色设定（Markdown）</label>
      <textarea id="newRoleContent" placeholder="- 性格：…&#10;- 说话风格：…&#10;- 背景设定：…"></textarea>
    </div>
    <div class="toolbar plain mt-8">
      <button id="roleCreate" class="primary" type="button">创建人格</button>
      <span class="meta" id="roleCreateMsg"></span>
    </div>
  </details>
</section>

<section class="card">
  <h2>静默开关</h2>
  <div class="toolbar plain">
    <button id="silentOn" type="button">开启静默</button>
    <button id="silentOff" type="button">恢复正常</button>
  </div>
  <div class="meta mt-8">静默时群友消息不投递 agent，仅管理员可对话。</div>
</section>
</div>
