<div class="toolbar">
  <input id="vpName" class="w-md" placeholder="新包名字（如：爱音）">
  <input id="vpNotes" class="grow" placeholder="说明（可选）">
  <button id="vpCreate" class="primary" type="button">建包</button>
</div>

<div class="toolbar">
  <select id="vpPackSel" class="w-md" aria-label="目标语音包">
    <option value="">（还没有语音包）</option>
  </select>
  <input id="vpBvid" class="grow" placeholder="B站 bvid 或链接（BV1xx411c7mD）">
  <button id="vpAddBili" class="primary" type="button">从 B站抽音频</button>
</div>

<div class="toolbar">
  <div class="field-pair"><span class="field-label">起始秒</span><div class="pair-controls"><input id="vpStart" type="number" value="0" min="0"></div></div>
  <div class="field-pair"><span class="field-label">时长</span><div class="pair-controls"><input id="vpDur" type="number" value="30" min="1" max="600"><span class="unit">秒</span></div></div>
  <span id="vpMsg" class="msg"></span>
</div>

<div id="vpList" class="vp-list"></div>
