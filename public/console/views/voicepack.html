<div class="toolbar">
  <input id="vpName" class="w-md" placeholder="新包名字（如：爱音）">
  <input id="vpNotes" class="grow" placeholder="说明（可选）">
  <button id="vpCreate" class="primary" type="button">建包</button>
</div>

<div class="toolbar">
  <select id="vpPackSel" class="w-md"></select>
  <input id="vpBvid" class="grow" placeholder="B站 bvid 或链接（BV1xx411c7mD）">
  <input id="vpStart" type="number" value="0" min="0" placeholder="起始秒" class="w-sm">
  <input id="vpDur" type="number" value="30" min="1" max="600" placeholder="时长秒" class="w-sm">
  <button id="vpAddBili" class="primary" type="button">从 B站抽音频</button>
  <span id="vpMsg" class="msg"></span>
</div>

<div id="vpList" class="vp-list"></div>
