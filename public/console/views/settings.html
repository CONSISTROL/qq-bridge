<section class="card span-all">
  <h2>登录助手 <span class="meta">填手机号 → 发送验证码 → 收到后填进方框 → 登录</span></h2>
  <div class="meta">登录用的浏览器跑在隐藏屏上，不占你桌面；登录态会存进各自的 profile 目录（不进 git）。
    验证码只能由你本人收短信后填进来。</div>
</section>

<div id="loginSites"></div>

<section class="card span-all">
  <h2>画图浏览器（豆包）<span class="meta" id="drawState">未打开</span>
    <span class="card-actions">
      <button id="drawOpen" class="small primary" type="button">打开</button>
      <button id="drawShotBtn" class="small" type="button">刷新画面</button>
      <button id="drawClose" class="small" type="button">关闭</button>
    </span>
  </h2>
  <div class="meta">下面是豆包浏览器的实时截图。遇到「人机验证」（让你点某个图形）时，<b>直接在图上点一下</b>就会转发过去，点对了再回去重试画图。</div>
  <div id="drawShotBox" style="margin-top:8px"><span class="meta">还没画面</span></div>
</section>


<section class="card span-all">
  <h2>登录画面 <span class="meta">点「查看画面」看看浏览器现在停在哪一步</span>
    <span class="card-actions">
      <button id="lgShot" class="small" type="button">查看画面</button>
      <input id="lgShotSite" class="w-xs" placeholder="站点 id" value="deepseek" aria-label="站点">
      <input id="lgShotSite2" type="hidden">
    </span>
  </h2>
  <div id="lgShotBox" class="meta">还没有画面</div>
</section>
