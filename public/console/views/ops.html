<div class="grid cols-2">
<section class="card">
  <h2>测试发送</h2>
  <div class="toolbar plain">
    <select id="tsKind" class="w-sm">
      <option value="group">群</option>
      <option value="private">私聊</option>
    </select>
    <input type="text" id="tsId" class="w-md" placeholder="群号 / QQ 号">
  </div>
  <div class="field mt-8">
    <label>消息内容</label>
    <textarea id="tsMsg" placeholder="这是一条测试消息"></textarea>
  </div>
  <div class="toolbar plain mt-8">
    <button id="tsSend" class="primary" type="button">发送测试</button>
    <span class="meta" id="tsMsg2"></span>
  </div>
  <div class="meta mt-8">目标必须在白名单内，否则拒绝。</div>
</section>

<section class="card">
  <h2>桥接控制</h2>
  <div class="toolbar plain">
    <button id="restartBtn" class="danger" type="button">重启桥接</button>
    <span class="meta" id="restartMsg"></span>
  </div>
  <div class="toolbar plain mt-8">
    <button id="clearWsBtn" class="danger" type="button">清空 QQ 聊天工作区</button>
    <span class="meta" id="clearWsMsg"></span>
  </div>
  <div class="meta mt-8">由守护窗口启动时，重启后 5 秒自动恢复；清空工作区会归档全部 QQ 会话并清空活动日志。</div>
</section>
</div>
