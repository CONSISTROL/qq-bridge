<div class="view-head">
  <h2>相册</h2>
  <p class="muted">所有图片统一入口：<b>聊天收到的图</b>、<b>AI 发出的图</b>、<b>本地图库</b>、<b>pixiv 抓取</b>、<b>视频帧</b>。<br>
    每张图带元数据：添加时间、来源、备注/标签（点卡片看大图并编辑）；删除进回收站。</p>
</div>

<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
  <select id="albumSource"></select>
  <input id="albumSearch" type="search" placeholder="搜备注/标签/文件名…" style="min-width:220px">
  <button id="albumRescan" class="btn">重扫</button>
  <span id="albumStats" class="muted"></span>
  <span id="albumMsg" class="msg"></span>
</div>

<div id="albumGrid" class="album-grid"></div>
<div class="row" style="justify-content:center;margin:12px 0">
  <button id="albumMore" class="btn" style="display:none">加载更多</button>
</div>

<!-- 大图弹窗：看原图 + 改备注/标签 + 删除 -->
<div id="albumModal" class="album-modal" style="display:none">
  <div class="album-modal-box">
    <div class="album-modal-head">
      <span id="albumModalTitle" class="album-modal-title"></span>
      <button id="albumModalClose" class="btn">关闭</button>
    </div>
    <div class="album-modal-body">
      <div class="album-modal-imgwrap"><img id="albumModalImg" alt=""></div>
      <div class="album-modal-side">
        <div id="albumModalMeta" class="muted" style="font-size:12px"></div>
        <label class="album-label">备注</label>
        <textarea id="albumModalNotes" rows="3" placeholder="这张图是什么、什么时候用…"></textarea>
        <label class="album-label">标签（逗号分隔）</label>
        <input id="albumModalTags" type="text" placeholder="猫, 无语">
        <div class="row" style="gap:8px;margin-top:10px">
          <button id="albumModalSave" class="btn">保存</button>
          <button id="albumModalDelete" class="danger">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
  .album-card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; background: var(--panel); }
  .album-card:hover { border-color: var(--accent); }
  .album-card img { width: 100%; height: 120px; object-fit: cover; display: block; background: #16181d; }
  .album-meta { padding: 6px 8px; }
  .album-notes { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .album-modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .album-modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(1100px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .album-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .album-modal-title { font-size: 12px; color: var(--muted); word-break: break-all; }
  .album-modal-body { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; overflow: auto; }
  .album-modal-imgwrap { display: flex; align-items: center; justify-content: center; background: #0e1013; border-radius: 8px; min-height: 240px; }
  .album-modal-imgwrap img { max-width: 100%; max-height: 72vh; object-fit: contain; }
  .album-modal-side { display: flex; flex-direction: column; gap: 6px; }
  .album-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 760px) { .album-modal-body { grid-template-columns: 1fr; } }
</style>
