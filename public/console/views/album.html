<div class="toolbar">
  <span id="albumTabs" class="tabs"></span>
  <input id="albumSearch" type="search" class="grow" placeholder="搜备注/标签/文件名…">
  <button id="albumRescan" class="btn" type="button">重扫</button>
  <button id="albumSelectAll" class="btn" type="button">全选本页</button>
  <button id="albumDeleteSel" class="danger" type="button">删除选中</button>
  <button id="albumTrashBtn" class="btn" type="button">回收站</button>
  <span id="albumSelInfo" class="muted"></span>
  <span id="albumStats" class="muted"></span>
  <span id="albumMsg" class="msg"></span>
</div>

<div id="albumGrid" class="album-grid"></div>
<div id="albumPager" class="row center mt-12">
  <button id="albumPrev" class="btn" type="button">‹ 上一页</button>
  <span id="albumPageInfo" class="muted"></span>
  <button id="albumNext" class="btn" type="button">下一页 ›</button>
  <input id="albumJump" type="number" min="1" placeholder="页码" class="w-sm">
  <button id="albumJumpGo" class="btn" type="button">跳转</button>
</div>

<!-- 大图弹窗：看原图 + 改备注/标签 + 删除 -->
<div id="albumModal" class="album-modal" style="display:none">
  <div class="album-modal-box">
    <div class="album-modal-head">
      <span id="albumModalTitle" class="album-modal-title"></span>
      <button id="albumModalClose" class="btn" type="button">关闭</button>
    </div>
    <div class="album-modal-body">
      <div class="album-modal-imgwrap"><img id="albumModalImg" alt=""></div>
      <div class="album-modal-side">
        <div id="albumModalMeta" class="muted"></div>
        <label class="album-label">备注</label>
        <textarea id="albumModalNotes" rows="3" placeholder="这张图是什么、什么时候用…"></textarea>
        <label class="album-label">标签（逗号分隔）</label>
        <input id="albumModalTags" type="text" placeholder="猫, 无语">
        <div id="albumModalMsg" class="msg"></div>
        <div class="row mt-10">
          <button id="albumModalSave" class="primary" type="button">保存</button>
          <button id="albumModalDelete" class="danger" type="button">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 回收站：查看 / 还原 / 彻底删除 / 清空 -->
<div id="albumTrashModal" class="album-modal" style="display:none">
  <div class="album-modal-box modal-wide">
    <div class="album-modal-head">
      <span class="album-modal-title">回收站（删除的图先放这里，可还原）</span>
      <span class="row">
        <button id="albumTrashEmpty" class="danger" type="button">清空回收站</button>
        <button id="albumTrashClose" class="btn" type="button">关闭</button>
      </span>
    </div>
    <div class="album-modal-body single-col">
      <div id="albumTrashMsg" class="msg"></div>
      <div id="albumTrashList" class="album-trash-list"></div>
    </div>
  </div>
</div>
